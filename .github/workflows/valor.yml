# Parra valör tablosu (22 Kasım 2026): TEFAS fon sayfalarından alış/satış valörü ve Borsa İstanbul takas günü;
# fon/tr/valor.json'a yazar. 23 Kasım 2026 (kullanıcı): valör seyrek değişiyor, ayda bir elle yeterli — zamanlama yok.
# GitHub'da TEFAS sayfaları valörsüz geldi (ilk 30 fonda okunamazsa betik durur, teşhis satırı yazar); öyleyse tablo
# Türkiye'deki bir makinede üretilip valor.json elle yüklenir.
name: Valör tablosu
on:
  workflow_dispatch:
    inputs:
      en_cok:
        description: "Yenilenecek en çok fon (varsayılan: hepsi)"
        default: "3000"
permissions:
  contents: write
# Ayrı kuyruk: 45 dakikalık valör işi saatlik fon fiyatlarını bekletmesin (bekleyen tek iş kalıyor, öncekini düşürüyor).
# Farklı dosyalara yazıyorlar; push öncesi pull --rebase çakışmayı çözüyor.
concurrency:
  group: valor
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valörleri çek
        run: python3 valor_guncelle.py --cikti fon/tr --en-cok "${{ github.event.inputs.en_cok || '3000' }}"
      - name: Değişiklikleri yaz
        # Çalışırken depoya başka commit girdiyse (elle yükleme, öteki workflow) önce onu çekip üstüne koyar.
        run: |
          git config user.name "parra-fon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fon/tr/valor.json
          git diff --cached --quiet && exit 0
          git commit -m "Valör tablosu: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
