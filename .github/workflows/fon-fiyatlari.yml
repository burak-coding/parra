name: Fon fiyatları
on:
  schedule:
    - cron: "15 9 * * 1-5"    # 12:15 İstanbul
    - cron: "30 15 * * 1-5"   # 18:30 İstanbul
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fon-fiyatlari
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatları çek
        run: python3 fon_guncelle.py --cikti fon/tr --doldur 150
      - name: Değişiklikleri yaz
        run: |
          git config user.name "parra-fon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fon
          git diff --cached --quiet || git commit -m "Fon fiyatları: $(date -u +%Y-%m-%d)" && git push
